services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      PORT: 3000
      DEMO_MODE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - padlet-data:/app/data
volumes:
  padlet-data:
